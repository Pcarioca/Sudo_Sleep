spring.application.name=sudosleep-backend

# Optional local .env file (gitignored; see backend/.env.example)
spring.config.import=optional:file:.env[.properties]

# --- PostgreSQL (defaults match docker-compose.yml; override with env vars) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sudosleep}
spring.datasource.username=${DB_USER:sudosleep}
spring.datasource.password=${DB_PASSWORD:sudosleep}

# --- JPA / Hibernate ---
# "update" creates/updates tables from the entities: fine while developing.
# Switch to "validate" (and manage the schema with SQL migrations) once the schema is stable.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# --- Stateless JWT Auth (override JWT_SECRET in .env / deployment env!) ---
app.jwt.secret=${JWT_SECRET:dev-only-insecure-secret-change-me-at-least-32-bytes-long}
app.jwt.access-expiration-seconds=${JWT_ACCESS_EXPIRATION_SECONDS:3600}
app.jwt.refresh-expiration-seconds=${JWT_REFRESH_EXPIRATION_SECONDS:2592000}

# --- OAuth Social Token Verification (supply via .env / environment variables) ---
app.oauth.google.web-client-id=${GOOGLE_WEB_CLIENT_ID:}
app.oauth.facebook.app-id=${FACEBOOK_APP_ID:}
app.oauth.facebook.app-secret=${FACEBOOK_APP_SECRET:}

# --- Forgot-Password Email (SMTP; leave MAIL_HOST blank in local dev to skip SMTP send) ---
app.mail.from=${MAIL_FROM:no-reply@sudosleep.app}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- Swagger UI: http://localhost:8080/swagger-ui.html ---
springdoc.swagger-ui.path=/swagger-ui.html
