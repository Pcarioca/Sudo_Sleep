spring.application.name=sudosleep-backend

# --- PostgreSQL (defaults match docker-compose.yml; override with env vars) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sudosleep}
spring.datasource.username=${DB_USER:sudosleep}
spring.datasource.password=${DB_PASSWORD:sudosleep}

# --- JPA / Hibernate ---
# "update" creates/updates tables from the entities: fine while developing.
# Switch to "validate" (and manage the schema with SQL migrations) once the schema is stable.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# --- Swagger UI: http://localhost:8080/swagger-ui.html ---
springdoc.swagger-ui.path=/swagger-ui.html
